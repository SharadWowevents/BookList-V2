<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <title>MyDeepwork</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('listbook:theme');
          if (t) {
            try { t = JSON.parse(t); } catch(e) {}
            if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
          }
          var a = localStorage.getItem('listbook:accent');
          if (a) {
            try { a = JSON.parse(a); } catch(e) {}
            if (a) document.documentElement.setAttribute('data-accent', a);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
