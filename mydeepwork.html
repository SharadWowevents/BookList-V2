<title>MyDeepwork</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap">
<style>
/* Layout: two panes like the wireframe (lists/notes | content); one pane at a time on phones. */
:root{
  --bg:#F5F6F4; --panel:#FFFFFF; --ink:#16191A; --muted:#6B7270; --line:#E2E5E2;
  --soft:#ECEFEC; --accent:#1E6B57; --accent-ink:#FFFFFF; --star:#E2A21A; --danger:#B4412F;
  --display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1211; --panel:#171B1A; --ink:#EEF1EF; --muted:#97A09C; --line:#2A302E;
  --soft:#222826; --accent:#4FB394; --accent-ink:#08120F; --star:#F2BC45; --danger:#E5735F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1211; --panel:#171B1A; --ink:#EEF1EF; --muted:#97A09C; --line:#2A302E;
  --soft:#222826; --accent:#4FB394; --accent-ink:#08120F; --star:#F2BC45; --danger:#E5735F; color-scheme:dark}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body,#root{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
svg{display:block}

/* ---------- login ---------- */
.login{height:100%;overflow-y:auto;display:flex;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{margin:auto;width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px}
.brand{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,9vw,3.4rem);letter-spacing:-.03em;line-height:1}
.brand span{color:var(--accent)}
.tag{color:var(--muted);font-size:1.15rem;line-height:1.45;margin-top:-8px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;font-size:1.25rem;padding:16px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);outline:none}
.input:focus{border-color:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.2rem;font-weight:600;padding:17px 20px;border-radius:14px;background:var(--ink);color:var(--bg);width:100%}
.login-note{font-size:.95rem;color:var(--muted);line-height:1.5}
.err{color:var(--danger);font-size:1rem;min-height:1.2em}
.waiting{color:var(--muted);font-size:1.05rem}

/* ---------- app shell ---------- */
.app{height:100%;display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.side{position:relative;min-width:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.side-head{padding-block:22px 14px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr .hbtn{width:36px;height:40px}
.side-brand{font-family:var(--display);font-weight:700;font-size:1.4rem;letter-spacing:-.025em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-brand span{color:var(--accent)}
.link{font-size:.95rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.hdr{display:flex;gap:2px;margin-right:-8px}
.hbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.hbtn:hover{background:var(--soft)}
.hbtn.on{background:var(--soft);color:var(--accent)}
.hbtn.add{color:var(--accent)}
.side-foot{border-top:1px solid var(--line);display:flex;align-items:center;gap:4px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px}
.me{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:6px;border-radius:12px;text-align:left}
.me:hover{background:var(--soft)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--display);font-size:1.1rem;flex:none}
.me-text{display:flex;flex-direction:column;min-width:0}
.me-name{font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-sub{font-size:.85rem;color:var(--muted)}
.menu{position:absolute;left:10px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:280px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.18);padding:8px;z-index:30;display:flex;flex-direction:column;gap:6px}
.menu-label{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px 2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{height:40px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.accent-row{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;padding:2px 6px 6px}
.accent-sw{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--sw-l);border:0;position:relative}
.accent-sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--sw-l)}
.accent-sw.on::after{content:"";position:absolute;left:50%;top:46%;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:translate(-50%,-50%) rotate(45deg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .accent-sw{background:var(--sw-d)}:root:not([data-theme="light"]) .accent-sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--sw-d)}:root:not([data-theme="light"]) .accent-sw.on::after{border-color:#0B0F12}}
:root[data-theme="dark"] .accent-sw{background:var(--sw-d)}
:root[data-theme="dark"] .accent-sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--sw-d)}
:root[data-theme="dark"] .accent-sw.on::after{border-color:#0B0F12}
.menu-sep{height:1px;background:var(--line);margin:4px 2px}
.menu-item{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:10px;font-size:1.05rem;width:100%;text-align:left}
.menu-item:hover{background:var(--soft)}
.app.collapsed{grid-template-columns:72px minmax(0,1fr)}
.side.rail{align-items:center;gap:6px;padding-block:18px calc(12px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px)}
.rail-sep{width:28px;height:1px;background:var(--line);margin:6px 0;flex:none}
.rail-spacer{flex:1}
.rail .me{flex:none;padding:4px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.tab{padding:10px 8px;border-radius:10px;font-weight:600;font-size:1.05rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.tab.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab .n{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.new-list{display:flex;gap:8px}
.new-list .input{font-size:1.15rem;padding:12px 14px}
.lists{flex:1;overflow-y:auto;padding-block:10px 24px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px;display:flex;flex-direction:column;gap:2px}
.sec-label{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.group{display:flex;flex-direction:column;gap:2px;min-height:4px}
.list-row{display:flex;align-items:center;gap:6px;border-radius:14px;padding:4px 6px 4px 4px;user-select:none;-webkit-user-select:none}
.list-row:hover{background:var(--soft)}
.list-row.active{background:var(--soft)}
.list-row.active .list-name{font-weight:600}
.list-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 6px;font-size:1.4rem}
.list-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-name.untitled{color:var(--muted)}
.count{font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.side-empty{padding:18px 12px;color:var(--muted);font-size:1.05rem;line-height:1.5}
.grip{width:28px;height:44px;display:grid;place-items:center;color:var(--muted);opacity:.45;cursor:grab;touch-action:none;flex:none}
.grip:active{cursor:grabbing}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.star-btn.on{color:var(--star)}
.star-btn.on svg path{fill:currentColor}

/* ---------- main pane ---------- */
.main-head{padding-block:22px 10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:flex-start;gap:8px}
.back{display:none}
.title-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.title{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,6vw,3rem);letter-spacing:-.03em;line-height:1.08;border:0;background:none;outline:none;width:100%;padding:0;border-radius:8px}
.title{text-overflow:ellipsis;min-width:0}
.title::placeholder{color:var(--muted);opacity:.6}
.title:focus{background:var(--soft)}
.sub{color:var(--muted);font-size:1.05rem;font-variant-numeric:tabular-nums;min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-actions{display:flex;gap:2px;padding-top:6px}
.confirm{margin-left:max(20px,env(safe-area-inset-left,0px));margin-right:max(20px,env(safe-area-inset-right,0px));margin-bottom:8px;padding:14px 16px;border-radius:14px;background:var(--soft);display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:1.05rem}
.confirm span{flex:1;min-width:180px}
.pill{padding:10px 16px;border-radius:999px;font-weight:600;font-size:1rem}
.pill.danger{background:var(--danger);color:#fff}
.pill.plain{background:var(--panel)}
.pill.ink{background:var(--ink);color:var(--bg)}
.todos{flex:1;overflow-y:auto;padding-block:6px 24px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.todo-inner{max-width:860px;display:flex;flex-direction:column;gap:2px}
.todo{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 6px 6px 2px;margin-bottom:8px;user-select:none;-webkit-user-select:none}
.check{width:44px;height:44px;display:grid;place-items:center;flex:none}
.box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.check:hover .box{border-color:var(--accent)}
.todo.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.todo-text{flex:1;min-width:0;font-size:1.3rem;line-height:1.35;padding:10px 4px;overflow-wrap:anywhere;cursor:text}
.todo.done .todo-text{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.todo-edit{flex:1;min-width:0;font-size:1.3rem;padding:8px 10px;border-radius:10px;border:1.5px solid var(--accent);background:var(--bg);outline:none}
.del{opacity:.55}
.todo:hover .del{opacity:1}
.done-toggle{display:flex;align-items:center;gap:8px;font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 10px 8px}
.empty{padding:40px 12px;color:var(--muted);font-size:1.2rem;line-height:1.5;max-width:460px}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 10px 30px rgba(0,0,0,.12)}
.sortable-drag{opacity:.95}
.app.drag-todo .list-row:not(.active){outline:2px dashed var(--line);outline-offset:-2px}
.list-row.drop-hover,.list-row.drop-hover:hover{background:var(--accent);color:var(--accent-ink);outline-color:var(--accent)!important}
.list-row.drop-hover .count,.list-row.drop-hover .grip,.list-row.drop-hover .star-btn{color:var(--accent-ink)}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:10px;padding-block:14px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tray-label{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tray-chips{display:flex;flex-wrap:wrap;gap:8px;max-height:40vh;overflow:hidden}
.chip{padding:16px 20px;border-radius:14px;background:var(--soft);font-size:1.2rem;font-weight:600;border:2px dashed var(--line)}
.chip.drop-hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (min-width:761px){.tray{display:none}}

.composer{border-top:1px solid var(--line);background:var(--panel);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.composer form{max-width:860px;display:flex;gap:8px;align-items:center}
.composer .input{font-size:1.25rem;padding:14px 16px;background:var(--bg)}
.mic,.send{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;flex:none}
.mic{background:var(--soft)}
.send{background:var(--ink);color:var(--bg)}
.mic.live,.tb.live{background:var(--danger);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--danger) 25%,transparent)}}
.hint{max-width:860px;font-size:.95rem;color:var(--muted);padding-top:6px}
.hint:empty{display:none}

/* ---------- notes ---------- */
.toolbar{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;border-block:1px solid var(--line);background:var(--panel);padding-block:6px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.toolbar::-webkit-scrollbar{display:none}
.tb{min-width:40px;height:40px;padding:0 6px;border-radius:10px;display:grid;place-items:center;color:var(--ink);flex:none;font-size:1rem}
.tb:hover{background:var(--soft)}
.tb.on{background:var(--ink);color:var(--bg)}
.tt{font-weight:700;font-size:1.02rem;line-height:1;font-family:var(--body)}
.tt.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:1.15rem}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.subbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.subbar .lbl{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:84px}
.sw-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-basis:100%}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.95rem}
.sw:hover{border-color:var(--ink)}
.subbar .input{flex:1;min-width:180px;font-size:1.1rem;padding:11px 14px;background:var(--bg)}
.note-scroll{flex:1;overflow-y:auto;padding-block:22px calc(48px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.editor{position:relative;max-width:760px;min-height:55vh;outline:none;font-size:1.22rem;line-height:1.65;overflow-wrap:anywhere;caret-color:var(--accent)}
.editor.is-empty::before{content:attr(data-placeholder);position:absolute;top:0;left:0;color:var(--muted);opacity:.7;pointer-events:none}
.editor > :first-child{margin-top:0}
.editor p,.editor div{margin:0 0 .55em}
.editor h1,.editor h2,.editor h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.18;text-wrap:balance}
.editor h1{font-size:2.05rem;margin:1.1em 0 .4em}
.editor h2{font-size:1.6rem;margin:1em 0 .35em}
.editor h3{font-size:1.3rem;margin:.9em 0 .3em}
.editor ul,.editor ol{padding-left:1.4em;margin:0 0 .6em}
.editor li{margin:.15em 0}
.editor blockquote{margin:.7em 0;padding:.15em 0 .15em 18px;border-left:3px solid var(--accent);color:var(--muted)}
.editor pre{font-family:var(--mono);font-size:1rem;line-height:1.5;background:var(--soft);padding:14px 16px;border-radius:12px;white-space:pre-wrap;margin:.7em 0}
.editor a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.editor img{display:block;max-width:100%;height:auto;border-radius:12px;margin:.7em 0;background:var(--soft)}
.editor img:hover{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:2px}
.editor ul.checklist{list-style:none;padding-left:0}
.editor ul.checklist ul.checklist{padding-left:1.2em}
.editor ul.checklist > li{position:relative;padding-left:36px;margin:.3em 0}
.editor ul.checklist > li::before{content:"";position:absolute;left:1px;top:.22em;width:22px;height:22px;box-sizing:border-box;border:2px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;transition:background .15s,border-color .15s}
.editor ul.checklist > li:hover::before{border-color:var(--accent)}
.editor ul.checklist > li[data-checked="true"]::before{background:var(--accent);border-color:var(--accent)}
.editor ul.checklist > li[data-checked="true"]::after{content:"";position:absolute;left:9px;top:calc(.22em + 4px);width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg);pointer-events:none}
.editor ul.checklist > li[data-checked="true"]{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.note-scroll.ro .editor ul.checklist > li::before{cursor:default}
.editor div.ink{position:relative;margin:.8em 0;border-radius:14px;border:1px solid var(--line);background-color:var(--panel);background-image:radial-gradient(color-mix(in srgb,var(--muted) 30%,transparent) 1px,transparent 1.2px);background-size:24px 24px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;max-width:100%}
.editor div.ink canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.editor div.ink.active{outline:2.5px solid var(--accent);outline-offset:2px}
.editor div.ink.active canvas{touch-action:none;cursor:crosshair}
.ink-edit{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--ink);display:grid;place-items:center;opacity:.9;z-index:2}
.ink-edit:hover{opacity:1;background:var(--line)}
.editor div.ink.active .ink-edit{display:none}
.ink-grow{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:84px;height:22px;display:grid;place-items:center;cursor:ns-resize;touch-action:none;z-index:2}
.ink-grow::after{content:"";width:46px;height:5px;border-radius:3px;background:var(--line)}
.inkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.2);padding:6px;width:max-content;max-width:calc(100% - 24px);flex-wrap:wrap;justify-content:center;row-gap:4px}
.inkbar::-webkit-scrollbar{display:none}
.inkbar .tb[disabled]{opacity:.35;cursor:default}
.inkbar .tb.danger-on{background:var(--danger);color:#fff;font-weight:600;font-size:.9rem;padding:0 10px}

/* ---------- time ---------- */
function fmtTime(ts){
  if (!ts) return "";
  const d = new Date(ts), now = new Date();
  const t = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }).replace(/\s?(AM|PM)$/i, m => m.trim().toLowerCase());
  if (d.toDateString() === now.toDateString()) return t;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "yesterday, " + t;
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", ...(d.getFullYear() !== now.getFullYear() ? { year: "numeric" } : {}) }) + ", " + t;
}

function pickPhoto(file){
  if (!file || !/^image\//.test(file.type)) { toast("Choose an image file."); return; }

  fr.onload = () => {
    const img = new Image();
    img.onload = async () => {
      const s = 192, c = document.createElement("canvas"); c.width = c.height = s;
      const m = Math.min(img.width, img.height);

function subscribeShare(ref, kind){

let pendingLink = null;

/* ---------- sanitizing note HTML ---------- */
const DROP = new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","PICTURE","VIDEO","AUDIO","SVG","MATH","FORM","INPUT","BUTTON","TEXTAREA","SELECT","META","LINK","TITLE","HEAD","CANVAS","TEMPLATE","NOSCRIPT"]);
const KEEP = new Set(["P","BR","B","STRONG","I","EM","U","S","STRIKE","DEL","H1","H2","H3","UL","OL","LI","BLOCKQUOTE","PRE","CODE","A","HR","SPAN","DIV","FONT","SUB","SUP","IMG"]);
const STYLE_OK = ["color","background-color","text-align","font-weight","font-style","text-decoration","text-decoration-line","margin-left","padding-left","border","padding","margin"];
const BLOB_SRC = /^\/_blob\/[A-Za-z0-9_-]{8,64}$/;
const DATA_IMG = /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/;
function clean(html, pasted = false){
  const t = document.createElement("template"); t.innerHTML = html || "";
  const walk = node => {
    [...node.childNodes].forEach(n => {
      if (n.nodeType === 8) { n.remove(); return; }
      if (n.nodeType !== 1) return;
      if (DROP.has(n.tagName)) { n.remove(); return; }
      if (n.tagName === "DIV" && n.classList.contains("ink")) { sanitizeInkDiv(n); return; }
      walk(n);
      let el = n;
      if (/^H[4-6]$/.test(el.tagName)) { const h = document.createElement("h3"); h.append(...el.childNodes); el.replaceWith(h); el = h; }
      if (!KEEP.has(el.tagName)) { el.replaceWith(...el.childNodes); return; }
      const keepStyle = [];
      if (el.style) for (const p of STYLE_OK) {
        if (pasted && /color|margin|padding|border/.test(p)) continue;
        const v = el.style.getPropertyValue(p); if (v && !/url\(|expression/i.test(v)) keepStyle.push(`${p}:${v}`);
      }
      if (el.tagName === "IMG") {
        const src = (el.getAttribute("src") || "").trim();
        [...el.attributes].forEach(a => el.removeAttribute(a.name));
        if (BLOB_SRC.test(src) || (!pasted && DATA_IMG.test(src) && src.length < 600000)) { el.setAttribute("src", src); el.setAttribute("alt", ""); }
        else el.remove();
        return;
      }
      const isChecklist = el.tagName === "UL" && el.classList.contains("checklist");
      const checked = el.tagName === "LI" ? el.getAttribute("data-checked") : null;
      const href = el.tagName === "A" ? el.getAttribute("href") : null;
      const fcolor = el.tagName === "FONT" && !pasted ? el.getAttribute("color") : null;
      [...el.attributes].forEach(a => el.removeAttribute(a.name));
      if (keepStyle.length) el.setAttribute("style", keepStyle.join(";"));
      if (isChecklist) el.setAttribute("class", "checklist");
      if (checked === "true" || checked === "false") el.setAttribute("data-checked", checked);
      if (fcolor && /^#?[0-9a-z]+$/i.test(fcolor)) el.setAttribute("color", fcolor);
      if (href && /^(https?:|mailto:)/i.test(href.trim())) { el.setAttribute("href", href.trim()); el.setAttribute("target", "_blank"); el.setAttribute("rel", "noopener noreferrer"); }
      if ((el.tagName === "SPAN" || el.tagName === "FONT") && !el.attributes.length) el.replaceWith(...el.childNodes);
    });
  };
  walk(t.content);
  return t.innerHTML;
}

async function sha(s){
  try {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return "h" + h; }
}

    if (!accounts[key]) { accounts[key] = h; ls.set("listbook:accounts", accounts); }

const USERNAME_RE = /^[a-z0-9][a-z0-9._-]{2,29}$/;
async function deriveAuth(username, password){
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: new TextEncoder().encode("listbook|" + username), iterations: 150000 }, key, 256);
  return [...new Uint8Array(bits)].map(x => x.toString(16).padStart(2, "0")).join("");
}

function showAppLogin(msg){

async function startCloud(name){
  S.mode = "cloud"; S.name = name;
  const id = await claudeUser.id();
  if (!id) { toast("Your account can't save here. Using a device-only login."); showLocalLogin(); return; }
  S.uidKey = id;
  S.ref = claudeDb.doc("data/users/" + id + "/board");

  let first = true;
  S.unsub = S.ref.onSnapshot(snap => {

    if (!snap.exists) {

function reorderSubset(arr, ids){
  const set = new Set(ids), slots = [];
  arr.forEach((x, i) => { if (set.has(x.id)) slots.push(i); });
  const byId = Object.fromEntries(arr.map(x => [x.id, x]));
  const out = arr.slice();
  slots.forEach((slot, k) => out[slot] = byId[ids[k]]);
  return out;
}

/* ---------- wiring ---------- */
function wire(){
  sortables.forEach(s => s.destroy()); sortables = [];
  const opts = { animation: 160, delay: 180, delayOnTouchOnly: true, touchStartThreshold: 6, filter: ".todo-edit", preventOnFilter: false, ghostClass: "sortable-ghost", chosenClass: "sortable-chosen", dragClass: "sortable-drag" };
  document.querySelectorAll("[data-group^='list-']").forEach(g => {
    sortables.push(Sortable.create(g, { ...opts, onEnd(){ const ids = [...g.children].map(c => c.dataset.id); board.lists = reorderSubset(board.lists, ids); persist(); renderApp(); } }));
  });
  document.querySelectorAll("[data-group^='note-']").forEach(g => {
    sortables.push(Sortable.create(g, { ...opts, onEnd(){ const ids = [...g.children].map(c => c.dataset.id); board.notes = reorderSubset(board.notes, ids); persist(); renderApp(); } }));
  });
  const A = board.tab === "lists" ? active() : null;
  if (A && A.canEdit) document.querySelectorAll("[data-group^='todo-']").forEach(g => {
    sortables.push(Sortable.create(g, { ...opts, forceFallback: true, fallbackOnBody: true, fallbackTolerance: 4,
      onStart(){ startTodoDrag(); },
      onEnd(evt){
        const target = endTodoDrag(), a = active();
        if (target && target !== a.id) { moveTodo(evt.item.dataset.id, target); return; }
        const ids = [...g.children].map(c => c.dataset.id); a.data.todos = reorderSubset(a.data.todos, ids); saveList(a); renderApp();
      } }));
  });

  if ($("#addList")) $("#addList").onclick = () => {
    if (UI.adding) { UI.adding = false; renderApp(); return; }
    board.tab = "lists"; UI.adding = true; UI.confirm = false; UI.sharing = false; UI.publishing = false; UI.admin = false; setCollapsed(false); renderApp(); $("#newListName").focus();
  };
  if ($("#addNote")) $("#addNote").onclick = addNote;
  if ($("#newListForm")) {
    const inp = $("#newListName");
    $("#newListForm").onsubmit = e => {
      e.preventDefault();
      const name = inp.value.trim();
      UI.adding = false;
      if (name) { const l = { id: uid(), name, starred: false, todos: [] }; board.lists.push(l); board.activeId = l.id; board.tab = "lists"; UI.viewing = true; persist(); }
      renderApp();
      if (name && $("#newTodo")) $("#newTodo").focus();
    };
    inp.onblur = () => setTimeout(() => { if (UI.adding && !inp.value.trim()) { UI.adding = false; renderApp(); } }, 150);
    inp.onkeydown = e => { if (e.key === "Escape") { UI.adding = false; renderApp(); } };
  }
  const pi = $("#photoInput");
  if (pi) pi.onchange = () => { const f = pi.files && pi.files[0]; UI.menu = false; if (f) pickPhoto(f); };

  root.onclick = e => {
    if (!board) return;
    if (UI.menu && !e.target.closest("#menu,#meBtn,#settingsBtn")) { UI.menu = false; const m = $("#menu"); if (m) m.remove(); }
    const t = e.target.closest("button,[data-edit]"); if (!t || t.dataset.cmd || t.closest(".subbar")) return;
    const d = t.dataset, a = active(), nItem = activeNoteItem();
    if (UI.admin && (d.open || d.openNote || d.tab || t.id === "back")) { UI.admin = false; if (t.id === "back") { UI.viewing = false; renderApp(); return; } }
    const curKind = board.tab === "notes" ? "note" : "list";
    const curItem = curKind === "list" ? activeItem() : nItem;
    if (t.id === "meBtn" || t.id === "settingsBtn") { UI.menu = !UI.menu; renderApp(); }
    else if (t.id === "removePhoto") { UI.menu = false; removePhoto(); }
    else if (d.accentSet) { setAccent(d.accentSet); renderApp(); }
    else if (d.themeSet) { ls.set("listbook:theme", d.themeSet); applyTheme(d.themeSet); renderApp(); }
    else if (t.id === "signout") { UI.menu = false; signOut(); }
    else if (t.id === "openAdmin" || t.id === "openAdmin2") { UI.menu = false; UI.admin = true; UI.viewing = true; ADM.loaded = false; renderApp(); loadAdmin(); }
    else if (t.closest("#adminPage")) return;
    else if (t.id === "collapse") { setCollapsed(!UI.collapsed); UI.adding = false; renderApp(); }
    else if (d.tab) { if (board.tab !== d.tab) { flushNotes(); board.tab = d.tab; UI.confirm = false; UI.adding = false; UI.sharing = false; UI.publishing = false; persist(); renderApp(); } }
    else if (d.open) { board.activeId = d.open; board.tab = "lists"; UI.viewing = true; UI.confirm = false; UI.sharing = false; UI.publishing = false; persist(); renderApp(); }
    else if (d.openNote) openNote(d.openNote);
    else if (d.starList) { const l = board.lists.find(x => x.id === d.starList); l.starred = !l.starred; persist(); renderApp(); }
    else if (d.starNote) { const x = board.notes.find(x => x.id === d.starNote); x.starred = !x.starred; persist(); renderApp(); }
    else if (d.check && a.canEdit) { const x = a.data.todos.find(x => x.id === d.check); x.done = !x.done; saveList(a); renderApp(); }
    else if (d.star && a.canEdit) { const x = a.data.todos.find(x => x.id === d.star); x.starred = !x.starred; saveList(a); renderApp(); }
    else if (d.del && a.canEdit) {
      const i = a.data.todos.findIndex(x => x.id === d.del), lid = a.id; const [gone] = a.data.todos.splice(i, 1); saveList(a); renderApp();
      undoToast("Todo deleted.", () => { const r = resolveList(board.lists.find(x => x.id === lid)); if (r && r.data) { r.data.todos.splice(i, 0, gone); saveList(r); } });
    }
    else if (d.edit && a.canEdit) startEdit(t);
    else if (t.id === "back") { flushNotes(); UI.viewing = false; UI.confirm = false; UI.sharing = false; UI.publishing = false; renderApp(); }
    else if (t.id === "publishBtn") { UI.publishing = !UI.publishing; UI.sharing = false; UI.confirm = false; renderApp(); }
    else if (t.id === "closePublish") { UI.publishing = false; renderApp(); }
    else if (t.id === "doPublish") publishNote(t);
    else if (t.id === "shareBtn") { UI.sharing = !UI.sharing; UI.publishing = false; UI.confirm = false; renderApp(); }
    else if (t.id === "closeShare") { UI.sharing = false; UI.publishing = false; renderApp(); }
    else if (d.shareNew && curItem) {
      if (curKind === "note") { const ed = $("#editor"); if (ed && !curItem.ref) { noteCache[curItem.id] = { html: editorHTML(ed), updatedAt: Date.now() }; } }
      shareItem(curKind, curItem, d.shareNew);
    }
    else if (d.shareMode && curItem && curItem.ref) setShareMode(curItem.ref.sid, d.shareMode);
    else if (t.id === "copyLink") {
      const inp = $("#shareLink"), v = inp.value;
      const fallback = () => { inp.focus(); inp.select(); toast("Link selected. Copy it with your keyboard or the share menu."); };
      try { navigator.clipboard.writeText(v).then(() => toast("Link copied."), fallback); } catch { fallback(); }
    }
    else if (t.id === "stopShare" && curItem && curItem.ref) stopSharing(curKind, curItem);
    else if (t.id === "removeShared" && curItem) {
      const arr = curKind === "list" ? "lists" : "notes";
      board[arr] = board[arr].filter(x => x.id !== curItem.id); if (curItem.ref) unsubscribeShare(curItem.ref.sid);
      UI.viewing = false; persist(); renderApp();
    }
    else if (t.id === "askDelete") { UI.confirm = true; UI.sharing = false; UI.publishing = false; renderApp(); }
    else if (t.id === "cancelDel") { UI.confirm = false; renderApp(); }
    else if (t.id === "doDel" && curItem) {
      UI.confirm = false; UI.viewing = false;
      if (curItem.ref) deleteSharedDocs(curItem);
      if (curKind === "note") { board.notes = board.notes.filter(x => x.id !== curItem.id); if (!curItem.ref) deleteNoteBody(curItem.id); persist(); renderApp(); toast(curItem.ref && curItem.ref.owner !== myId() ? "Removed from your notes." : "Note deleted."); }
      else { board.lists = board.lists.filter(l => l.id !== curItem.id); persist(); renderApp(); toast(curItem.ref && curItem.ref.owner !== myId() ? "Removed from your lists." : "List deleted."); }
    }
    else if (t.id === "toggleDone") { UI.showDone = !UI.showDone; renderApp(); }
    else if (t.id === "mic") toggleVoice();
  };

  const title = $("#listTitle");
  if (title && !title.readOnly) {
    title.onkeydown = e => { if (e.key === "Enter") title.blur(); };
    title.onchange = () => { const v = title.value.trim(); const a = active(); if (v && a.data && v !== a.data.name) { a.data.name = v; if (a.shared) a.item.cachedName = v; saveList(a); } renderApp(); };
  }
  const form = $("#addForm");
  if (form) form.onsubmit = e => { e.preventDefault(); addTodo($("#newTodo").value); $("#newTodo").focus(); };
}
root.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !isEditing() && board) renderApp(); }, 60));

function addNote(){
  flushNotes(); UI.admin = false;
  const note = { id: uid(), title: "", starred: false };
  board.notes.unshift(note);
  noteCache[note.id] = { html: "", updatedAt: Date.now() };
  noteFetched.add(note.id);
  UI.adding = false;
  openNote(note.id);
  const t = $("#noteTitle"); if (t) t.focus();
}
function openNote(id){
  if (board.activeNoteId !== id) flushNotes();
  board.activeNoteId = id; board.tab = "notes"; UI.viewing = true; UI.confirm = false; UI.sharing = false; UI.publishing = false;
  persist(); renderApp();
}

/* ---------- rich text editor ---------- */

  const f = $("#admForm"), nm = $("#admName"), un = $("#admUser");
  let userTouched = false;
  un.oninput = () => { userTouched = true; un.value = un.value.toLowerCase().replace(/[^a-z0-9._-]/g, ""); };
  nm.oninput = () => { if (!userTouched) un.value = suggestUsername(nm.value); };
  $("#admPw").oninput = e => { ADM.pw = e.target.value; };
  const s = $("#admSearch"); if (s) s.oninput = () => { ADM.q = s.value; const pos = s.selectionStart; renderApp(); const s2 = $("#admSearch"); if (s2) { s2.focus(); s2.setSelectionRange(pos, pos); } };
  f.onsubmit = async e => {
    e.preventDefault();
    const err = $("#admErr"), name = nm.value.trim(), u = un.value.trim().toLowerCase(), pw = $("#admPw").value;
    if (!name) { err.textContent = "Enter the person's name."; return; }
    if (!USERNAME_RE.test(u)) { err.textContent = "Usernames are 3–30 characters: lowercase letters, numbers, dots, dashes or underscores."; return; }
    if (pw.length < 8) { err.textContent = "Use a password of at least 8 characters."; return; }
    ADM.busy = true; f.querySelector(".btn").disabled = true; f.querySelector(".btn").textContent = "Creating…";
    try {
      const exists = await claudeDb.doc("dir/" + u).get();
      if (exists.exists) { err.textContent = `“${u}” is already taken. Try another username.`; throw 0; }
      const id = await deriveAuth(u, pw);
      await claudeDb.doc("dir/" + u).set({ name, status: "active", createdAt: Date.now(), createdBy: myId() });
      await claudeDb.doc("auth/" + id).set({ u });
      await claudeDb.doc("acct/" + u).set({ authId: id, updatedAt: Date.now() });
      ADM.creds = { u, pw, name }; ADM.pw = genPassword(); ADM.showPw = false;
      ADM.busy = false; ADM.loaded = false; await loadAdmin();
      toast(`${name} can now sign in.`);
      if (!APP.requireLogin) setTimeout(() => toast("Turn on “Require sign-in” when everyone has their details.", 4500), 3300);
      return;
    } catch (x) { if (x !== 0) err.textContent = "Couldn't create the sign-in. Only editors of MyDeepwork can add people."; }
    ADM.busy = false; f.querySelector(".btn").disabled = false; f.querySelector(".btn").textContent = "Create sign-in";
  };
  page.onclick = async e => {
    const b = e.target.closest("[data-adm]"); if (!b) return;
    const act = b.dataset.adm, u = b.dataset.u, who = ADM.users.find(x => x.u === u);
    try {
      if (act === "eye") { ADM.showPw = !ADM.showPw; const i = $("#admPw"); i.type = ADM.showPw ? "text" : "password"; return; }
      if (act === "regen") { ADM.pw = genPassword(); const i = $("#admPw"); i.value = ADM.pw; i.type = "text"; ADM.showPw = true; return; }
      if (act === "copycreds") {
        const t = $("#credsText");
        const fallback = () => { t.classList.add("show"); t.focus(); t.select(); toast("Details selected. Copy them with your keyboard."); };
        try { navigator.clipboard.writeText(t.value).then(() => toast("Sign-in details copied."), fallback); } catch { fallback(); }
        return;
      }
      if (act === "closecreds") { ADM.creds = null; renderApp(); return; }
      if (act === "require") {
        const v = !APP.requireLogin;
        await claudeDb.doc("config/app").set({ requireLogin: v, updatedAt: Date.now(), updatedBy: myId() });
        APP.requireLogin = v; renderApp();
        toast(v ? "Sign-in is now required for everyone except editors." : "Sign-in is no longer required.");
        return;
      }
      if (act === "askdel") { ADM.confirmDel = u; renderApp(); return; }
      if (act === "canceldel") { ADM.confirmDel = null; renderApp(); return; }
      if (act === "dodel" && who) {
        const acct = await claudeDb.doc("acct/" + u).get();
        if (acct.exists && acct.data().authId) await claudeDb.doc("auth/" + acct.data().authId).delete();
        await claudeDb.doc("acct/" + u).delete(); await claudeDb.doc("dir/" + u).delete();
        ADM.confirmDel = null; ADM.loaded = false; await loadAdmin(); toast(`${who.name || u} was deleted and can't sign in.`); return;
      }
      if (act === "toggle" && who) {
        const next = who.status === "active" ? "off" : "active";
        await claudeDb.doc("dir/" + u).update({ status: next, updatedAt: Date.now() });
        ADM.loaded = false; await loadAdmin(); toast(next === "active" ? `${who.name || u} can sign in again.` : `${who.name || u} is turned off and signed out.`); return;
      }
      if (act === "reset" && who) {
        const pw = genPassword(), id = await deriveAuth(u, pw);
        const acct = await claudeDb.doc("acct/" + u).get();
        await claudeDb.doc("auth/" + id).set({ u });
        if (acct.exists && acct.data().authId && acct.data().authId !== id) await claudeDb.doc("auth/" + acct.data().authId).delete();
        await claudeDb.doc("acct/" + u).set({ authId: id, updatedAt: Date.now() });
        ADM.creds = { u, pw, name: who.name || u, reset: true }; renderApp();
        const sc = $(".admin-scroll"); if (sc) sc.scrollTop = 0;
        return;
      }
    } catch { toast("That didn't work. Only editors of MyDeepwork can manage people. Try again."); }
  };
}

  if (claudeUser && claudeDb) {
    const ask = fn => { try { return Promise.resolve(fn()).catch(() => false); } catch { return Promise.resolve(false); } };
    const [o, e] = await Promise.all([ask(() => claudeUser.isOwner()), ask(() => claudeUser.canEdit())]);
    APP.admin = !!(o || e);
    try { const c = await claudeDb.doc("config/app").get(); APP.requireLogin = !!(c.exists && c.data().requireLogin); } catch {}
    if (location.hash === "#admin" && APP.admin) { UI.admin = true; UI.viewing = true; }
  }
  probeDone = true;
  const gated = APP.requireLogin && !APP.admin && claudeUser && claudeDb;
  if (sess && sess.mode === "local") { if (gated) { ls.del("listbook:session"); showLogin(); } else startLocal(sess.key, sess.name); return; }
  if (sess && sess.mode === "cloud" && claudeUser && claudeDb) {
    if (gated) {
      if (!sess.appUser || !sess.authId) { showLogin(); return; }
      const v = await verifyAppSession(sess);
      if (!v.ok) { ls.del("listbook:session"); showLogin(v.msg); return; }
      APP.appUser = sess.appUser; APP.authId = sess.authId; startCloud(v.name); return;
    }
    const me = await claudeUser.me(); startCloud(me.name || "You");
  } else showLogin();
}
window.addEventListener("hashchange", () => { const h = readHash(); if (h) { pendingLink = h; tryOpenPending(); } });
window.addEventListener("beforeunload", () => { flush(); flushNotes(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { flush(); flushNotes(); } });
boot();
})();
